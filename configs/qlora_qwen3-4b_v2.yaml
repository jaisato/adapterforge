# v2: dataset diversificado + 1 epoch + LR reducido (anti sobre-ajuste de formato).
name: juristune-qwen3-4b-v2
base_model: Qwen/Qwen3-4B-Instruct-2507
dataset_path: data/processed/juristune-v2_train.jsonl
output_dir: artifacts/qlora_qwen3-4b-v2

seq_len: 1536
lr: 1.0e-4
epochs: 1
batch_size: 1
grad_accum: 16
warmup_ratio: 0.03
seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]