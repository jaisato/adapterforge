# Fase 2: alineamiento DPO sobre el adapter SFT (formato/estilo).
# Con PEFT no hay modelo de referencia separado: cabe en 8 GB.
name: juristune-qwen3-4b-dpo
base_model: Qwen/Qwen3-4B-Instruct-2507
dataset_path: data/processed/sample_dpo.jsonl
output_dir: artifacts/dpo_qwen3-4b

seq_len: 1024
lr: 5.0e-6 # DPO: lr mucho menor que en SFT
epochs: 1
batch_size: 1
grad_accum: 16
warmup_ratio: 0.03
seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

dpo:
  beta: 0.1
  max_prompt_len: 768
