# Alternativa: Llama-3.2-3B-Instruct (modelo gated: acepta la licencia en HF
# y exporta HF_TOKEN antes de entrenar). Algo más ligero que Qwen3-4B.
name: juristune-llama-3.2-3b
base_model: meta-llama/Llama-3.2-3B-Instruct
dataset_path: data/processed/sample_sft.jsonl
output_dir: artifacts/qlora_llama-3.2-3b

seq_len: 1024
lr: 2.0e-4
epochs: 2
batch_size: 1
grad_accum: 16
warmup_ratio: 0.03
seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
