# Despliegue de la demo pública (HF Space, CPU): sincroniza la carpeta space/
# con el Space Jaisato/adapterforge-demo. El Space descarga al arrancar el GGUF
# Q4_K_M de AF_GGUF_REPO (por defecto Jaisato/juristune-qwen3-4b-gguf) y lo
# sirve con llama-cpp-python (sin GPU).
#
# Solo manual (gh workflow run deploy-hf.yml): el repo GGUF se publica aparte
# y, si no existe, space/app.py falla al importarse y el Space queda en
# «Runtime error». Por eso no se dispara con los tags v* y, antes de subir
# nada, comprueba que el GGUF existe. Ver docs/RELEASING.md.
#
# Secrets necesarios:
#   HF_TOKEN -> token de escritura del namespace Jaisato
name: deploy-hf

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Los mismos valores por defecto que space/app.py. Si el Space usa otros
  # (Variables del Space), defínelos también como variables del repositorio.
  GGUF_REPO: ${{ vars.AF_GGUF_REPO || 'Jaisato/juristune-qwen3-4b-gguf' }}
  GGUF_FILE: ${{ vars.AF_GGUF_FILE || 'juristune-q4_k_m.gguf' }}

jobs:
  deploy-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar huggingface_hub
        # Misma horquilla que el extra `hub` de pyproject.toml.
        run: pip install "huggingface_hub>=0.34,<1"

      - name: Comprobar que existe el GGUF que carga el Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys

          from huggingface_hub import HfApi

          repo, filename = os.environ["GGUF_REPO"], os.environ["GGUF_FILE"]
          if not HfApi().file_exists(repo, filename):
              print(
                  f"::error::No existe {repo}/{filename}: el Space fallaría al arrancar. "
                  "Publica antes el GGUF (docs/RELEASING.md)."
              )
              sys.exit(1)
          print(f"GGUF disponible: {repo}/{filename}")
          PY

      - name: Subir carpeta space/ al Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/deploy_space.py --repo-id Jaisato/adapterforge-demo
