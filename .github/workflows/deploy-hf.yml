# Despliegue de la demo pública (HF Space, CPU): sincroniza la carpeta space/
# con el Space Jaisato/adapterforge-demo. El Space carga el GGUF Q4_K_M desde
# HF Hub con llama-cpp-python (sin GPU).
#
# Secrets necesarios:
#   HF_TOKEN -> token de escritura del namespace Jaisato
name: deploy-hf

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar huggingface_hub
        run: pip install "huggingface_hub>=0.30,<1"

      - name: Subir carpeta space/ al Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/deploy_space.py --repo-id Jaisato/adapterforge-demo
