# CI básico: lint + tests del núcleo (sin GPU ni red).
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar núcleo + dev
        # transformers (sin torch ni GPU) solo para el test del callback NaN-abort,
        # que hereda de TrainerCallback; misma horquilla que el extra `train`.
        run: pip install -e ".[dev]" "transformers>=4.51,<4.57"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest
