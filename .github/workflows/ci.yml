# CI del núcleo (sin GPU ni red). Lint y tests los ejecuta el workflow
# reutilizable python-ci de jaisato/.github; aquí solo se pasa lo que
# diferencia a este repositorio. Las comprobaciones propias (los cuatro
# workflows con actionlint) quedan en un job aparte.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python
    uses: jaisato/.github/.github/workflows/python-ci.yml@main
    with:
      python-versions: '["3.12"]'
      # transformers (sin torch ni GPU) solo para el test del callback NaN-abort,
      # que hereda de TrainerCallback; misma horquilla que el extra `train`.
      install-command: pip install -e ".[dev]" "transformers>=4.51,<4.57"
      ruff-paths: .
      # Paridad con el CI anterior: solo `ruff check`. El repositorio no está
      # formateado con `ruff format` (19 ficheros cambiarían); activar
      # ruff-format exige antes un commit de formateo.
      ruff-format: false
      # Auditoría de dependencias del entorno instalado. Informativa
      # (pip-audit-strict=false): una CVE sin parche aguas arriba no bloquea
      # el CI, pero queda visible en el job.
      run-pip-audit: true
      pip-audit-strict: false

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: actionlint
        run: pipx run --spec 'actionlint-py==1.7.12.25' actionlint -no-color .github/workflows/*.yml
