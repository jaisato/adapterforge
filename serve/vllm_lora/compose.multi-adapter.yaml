# Snippet de override: sirve VARIOS adapters LoRA sobre la misma base.
# Uso:
#   docker compose -f compose.yaml -f serve/vllm_lora/compose.multi-adapter.yaml \
#     --profile serve-vllm up vllm
services:
  vllm:
    command: >
      --model Qwen/Qwen3-4B-Instruct-2507
      --max-model-len 4096
      --gpu-memory-utilization 0.90
      --enable-lora
      --max-lora-rank 32
      --lora-modules juristune=/adapters/juristune juristune-dpo=/adapters/juristune-dpo
    volumes:
      - ../../artifacts/qlora_qwen3-4b/adapter:/adapters/juristune:ro
      - ../../artifacts/dpo_qwen3-4b/adapter:/adapters/juristune-dpo:ro
